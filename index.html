}
/* ============================================================
   READING PASSWORD-PROTECTED SAVE FILES
   Saving no longer offers a password — files download as plain
   .json. This block stays so that any .slq file written by an
   earlier version of the form can still be opened.
   AES-GCM 256, key derived with PBKDF2-SHA256 (310,000 rounds).
   ============================================================ */

const CRYPTO_OK = !!(window.isSecureContext && window.crypto && window.crypto.subtle);
const KDF_ROUNDS = 310000;

function b64(u8){
  let s='', CH=0x8000;
  for(let i=0;i<u8.length;i+=CH) s += String.fromCharCode.apply(null, u8.subarray(i,i+CH));
  return btoa(s);
}
function unb64(s){ return Uint8Array.from(atob(s), c=>c.charCodeAt(0)); }

async function deriveKey(pass, salt, use){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass),
    'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt, iterations:KDF_ROUNDS, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, [use]);
}
/* kept alongside decryptPayload so the pair stays readable; nothing calls it
   while saving is unprotected */
async function encryptPayload(obj, pass){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv   = crypto.getRandomValues(new Uint8Array(12));
  const key  = await deriveKey(pass, salt, 'encrypt');
  const ct   = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key,
                 new TextEncoder().encode(JSON.stringify(obj)));
  return { format:'SLQ-ENC-1', note:'Schumacher Lane client questionnaire — password protected.',
           kdf:'PBKDF2-SHA256', iterations:KDF_ROUNDS,
           salt:b64(salt), iv:b64(iv), data:b64(new Uint8Array(ct)) };
}
async function decryptPayload(env, pass){
  const key = await deriveKey(pass, unb64(env.salt), 'decrypt');
  const pt  = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(env.iv)}, key, unb64(env.data));
  return JSON.parse(new TextDecoder().decode(pt));
}

/* ---------- small promise-based modal ---------- */
function modal(opts){
  return new Promise(resolve=>{
    const bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.innerHTML = `<div class="modal"><h3>${esc(opts.title)}</h3>
      <div class="mbody">${opts.body}<div class="merr" id="mErr"></div></div>
      <div class="mfoot">${opts.buttons.map((b,i)=>
        `<button type="button" class="btn ${b.cls||''}" data-mv="${i}">${esc(b.label)}</button>`).join('')}</div></div>`;
    document.body.appendChild(bg);
    const finish = v => { bg.remove(); resolve(v); };
    bg.addEventListener('click', ev=>{
      const btn = ev.target.closest('[data-mv]');
      if(!btn) return;
      const spec = opts.buttons[+btn.getAttribute('data-mv')];
      if(spec.validate){
        const err = spec.validate(bg);
        if(err){ bg.querySelector('#mErr').textContent = err; return; }
      }
      finish(typeof spec.value==='function' ? spec.value(bg) : spec.value);
    });
    bg.addEventListener('keydown', ev=>{
      if(ev.key==='Enter'){
        ev.preventDefault();
        const primary = bg.querySelector('[data-mv="0"]');
        if(primary) primary.click();
      }
    });
    const first = bg.querySelector('input');
    if(first) setTimeout(()=>first.focus(), 60);
  });
}

/* ---------- save ---------- */
function downloadFile(text, name, mime){
  const blob = new Blob([text], {type:mime||'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function basePayload(){
  return { _meta:{ form:'Schumacher Lane, PLLC — Client Questionnaire', version:FORM_VERSION,
                   savedAt:new Date().toISOString(), client:S.data.clientName||'' },
           data:S.data };
}

/* Builds the file the client will keep or send. Returns {blob,name,locked}
   or null if they backed out. Shared by Save and Send. */
async function buildSaveBlob(){
  const stem = safeName().replace(/\.json$/,'');
  return {
    blob: new Blob([JSON.stringify(basePayload(),null,2)], {type:'application/json'}),
    name: stem + '.json',
    locked: false
  };
}
/* Saving no longer offers a password — it downloads straight away. The
   decryption side is deliberately kept: any .slq file saved by an earlier
   version of this form still opens through "Open saved file". */

function downloadBlob(blob, name){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

async function doSave(){

  if(!r) return;
  downloadBlob(r.blob, r.name);
  markSaved(r.name + (r.locked?'  \u{1F512}':''));
}

/* ---------- load ---------- */
/* Carry answers forward when a question changes shape between versions, so a
   file saved on an older build still opens with nothing lost. Safe to re-run. */
function migrateData(d){
  if(!d || typeof d!=='object') return d;

  /* item 18 became a repeater — fold the old single row into the list */
  if(!Array.isArray(d.pp18)){
    const had = ['pp18Item','pp18Val','pp18Due'].some(k=>{
      const v=d[k]; return typeof v==='string' && v.trim()!=='';
    });
    if(had){
      d.pp18 = [{p18Item:d.pp18Item||'', p18Val:d.pp18Val||'', p18Due:d.pp18Due||''}];
      delete d.pp18Item; delete d.pp18Val; delete d.pp18Due;
    }
  }

  /* household goods dropped their tick boxes — a value alone now means "owned",
     so an old row that was ticked but left blank would otherwise vanish */
  if(typeof HG_ITEMS!=='undefined'){
    HG_ITEMS.forEach(it=>{
      const onKey='hg_'+it[0]+'_on', vKey='hg_'+it[0]+'_v', xKey='hg_'+it[0]+'_x';
      if(d[onKey]){
        const blank = !(typeof d[vKey]==='string' && d[vKey].trim()!=='')
                   && !(typeof d[xKey]==='string' && d[xKey].trim()!=='');
        if(blank) d[vKey]='0';
      }
      delete d[onKey];
    });
  }

  /* payroll detail is gone; if net pay was never filled in, fall back to
     gross minus the deductions that were */
  if(!(typeof d.payNet_d==='string' && d.payNet_d.trim()!=='') && d.payGross_d){
    const n = v => { const x=parseFloat(String(v||'').replace(/[^0-9.\-]/g,'')); return isFinite(x)?x:0; };
    const net = n(d.payGross_d)+n(d.payOvertime_d)
      - ['dedTax','dedIns','dedMedical','dedUnion','dedRetire','dedSupport','dedOther']
          .reduce((t,k)=>t+n(d[k+'_d']),0);
    if(net>0) d.payNet_d = String(net);
  }

  /* The Statement of Financial Affairs was rebuilt against Official Form 107,
     so the old Form 7 question numbers (q1a..q17) no longer render. Carry the
     answers that map one-to-one onto the new questions. Anything not listed
     below stays untouched in the file — nothing is deleted — but it will not
     appear on screen and needs a person to re-key it. */
  if(!d._sofa107){
    const pick = (src, map) => {
      const o = {}; let any = false;
      for(const k in map){
        const v = src[k];
        if(v!=null && v!=='' && !(Array.isArray(v) && !v.length)){ o[map[k]] = v; any = true; }
      }
      return any ? o : null;
    };
    const put = (newId, rows, flag) => {
      rows = rows.filter(Boolean);
      if(!rows.length) return;
      if(Array.isArray(d[newId]) && d[newId].length) return;   /* never clobber */
      d[newId] = rows;
      if(flag) d[flag] = 'Yes';
    };
    const rep  = id => Array.isArray(d[id]) ? d[id] : [];
    const A    = (op,np) => ({[op+'Addr']:np+'Addr', [op+'City']:np+'City',
                              [op+'State']:np+'State', [op+'Zip']:np+'Zip'});

    put('sofa2List',  rep('q15').map(it=>pick(it,{q15Addr:'s2Addr',q15City:'s2City',
        q15State:'s2State',q15Zip:'s2Zip',q15Dates:'s2From'})), 'sofa2');
    put('sofa6List',  rep('q3a').map(it=>pick(it,{q3aCred:'s6Name',...A('q3a','s6'),
        q3aDates:'s6Dates',q3aAmt:'s6Paid',q3aBal:'s6Owe'})), 'sofa6Con');
    put('sofa7List',  rep('q3b').map(it=>pick(it,{q3bRel:'s7Name',...A('q3b','s7'),
        q3bDates:'s7Dates',q3bAmt:'s7Paid',q3bBal:'s7Owe',q3bRelation:'s7Reason'})), 'sofa7');
    put('sofa9List',  rep('q4a').map(it=>pick(it,{q4aCaption:'s9Title',q4aCase:'s9Number',
        q4aNature:'s9Nature',q4aCourt:'s9Court'})), 'sofa9');
    put('sofa10List', [...rep('q4b').map(it=>pick(it,{q4bCred:'s10Name',...A('q4b','s10'),
        q4bDate:'s10Date',q4bDesc:'s10Desc'})),
                       ...rep('q5').map(it=>pick(it,{q5Cred:'s10Name',...A('q5','s10'),
        q5Date:'s10Date',q5Desc:'s10Desc'}))], 'sofa10');
    put('sofa13List', rep('q7').map(it=>pick(it,{q7Name:'s13Name',...A('q7','s13'),
        q7Rel:'s13Rel',q7Date:'s13Date',q7Desc:'s13Desc'})), 'sofa13');
    put('sofa18List', rep('q10').map(it=>pick(it,{q10Name:'s18Name',...A('q10','s18'),
        q10Rel:'s18Rel',q10Date:'s18Date',q10Desc:'s18Desc'})), 'sofa18');
    put('sofa20List', rep('q11').map(it=>pick(it,{q11Bank:'s20Name',...A('q11','s20'),
        q11Type:'s20Type',q11TypeOther:'s20TypeOther',q11Num:'s20Acct',
        q11Closed:'s20Date',q11Bal:'s20Bal'})), 'sofa20');

    /* the old form asked these as a single block rather than a list */
    put('sofa11List', [pick(d,{q13Cred:'s11Name',...A('q13','s11'),
        q13Date:'s11Date',q13Amt:'s11Amt'})], 'sofa11');
    put('sofa15List', [pick(d,{q8Desc:'s15Desc',q8Circ:'s15Ins',q8Date:'s15Date'})], 'sofa15');
    put('sofa16List', [pick(d,{q9Payee:'s16Name',...A('q9','s16'),
        q9Amt:'s16Amt',q9Date:'s16Date',q9Who:'s16Payer'})], 'sofa16');
    put('sofa21List', [pick(d,{q12Bank:'s21Name',...A('q12','s21'),
        q12Contents:'s21Contents',q12Access:'s21AccName'})], 'sofa21');
    put('sofa23List', [pick(d,{q14Owner:'s23Name',...A('q14','s23'),
        q14Desc:'s23Desc',q14Loc:'s23LocAddr'})], 'sofa23');
    put('sofa24List', [pick(d,{q17Name:'s24Name',...A('q17','s24'),
        q17Agency:'s24Unit',q17Date:'s24Date',q17Type:'s24Law'})], 'sofa24');

    if(typeof d.q6aCred==='string' && d.q6aCred.trim()!=='' && !d.sofa12){
      d.sofa12  = 'Yes';
      d.sofa12X = [d.q6aCred, d.q6aDate, d.q6aTerms].filter(Boolean).join(' — ');
    }
    if(Array.isArray(d.q16States) && d.q16States.length && !d.sofa3){
      d.sofa3      = 'Yes';
      d.sofa3Spouse = d.q16Spouse || '';
      d.sofa3Where  = [d.q16States.join(', '), d.q16Date].filter(Boolean).join(' — ');
    }
    d._sofa107 = 1;
  }

  /* keep enough Other-expense rows to show every one that has an answer */
  let maxOther = 0;
  Object.keys(d).forEach(k=>{
    const m = /^expOther(\d+)(_[ds]|Label)?$/.exec(k);
    if(m && d[k]!=='' && d[k]!=null) maxOther = Math.max(maxOther, +m[1]);
  });
  if(maxOther > (+d.expOtherN||0)) d.expOtherN = maxOther;

  return d;
}

async function applyLoadedText(text, filename){
  let parsed;
  try{ parsed = JSON.parse(text); }
  catch(err){
    await modal({title:'That file could not be read',
      body:`<p>It does not look like a questionnaire file. Make sure you are opening the
            <code>.json</code> or <code>.slq</code> file this form saved.</p>`,
      buttons:[{label:'OK', cls:'gold', value:null}]});
    return;
  }

  if(parsed && typeof parsed.format==='string' && parsed.format.indexOf('SLQ-ENC')===0){
    if(!CRYPTO_OK){
      await modal({title:'Cannot open a protected file here',
        body:`<p>Encrypted files can only be opened over a secure (https) connection, and this page
              was opened directly from your computer.</p>
              <p>Open the questionnaire from its web address instead, then use
              <b>Open saved file</b> there.</p>`,
        buttons:[{label:'OK', cls:'gold', value:null}]});
      return;
    }
    while(true){
      const pass = await modal({
        title:'This file is password protected',
        body:`<p>Enter the password used when <b>${esc(filename||'this file')}</b> was saved.</p>
              <label for="pwd">Password</label><input type="password" id="pwd" autocomplete="off">`,
        buttons:[
          {label:'Unlock', cls:'gold', validate:bg=>bg.querySelector('#pwd').value ? null : 'Enter the password.',
           value:bg=>bg.querySelector('#pwd').value},
          {label:'Cancel', value:null}
        ]
      });
      if(pass===null) return;
      try{
        parsed = await decryptPayload(parsed, pass);
        break;
      }catch(err){
        const again = await modal({title:'That password did not work',
          body:`<p>The password did not unlock this file. Passwords are case-sensitive.</p>`,
          buttons:[{label:'Try again', cls:'gold', value:true},{label:'Give up', value:false}]});
        if(!again) return;
        parsed = JSON.parse(text);     /* re-read the envelope for the next attempt */
      }
    }
  }

  S.data = (parsed && parsed.data) ? parsed.data : parsed;
  migrateData(S.data);
  syncExpenseRows();
  Object.keys(_stepKeyCache).forEach(k=>delete _stepKeyCache[k]);
  S.step = 0; S.dirty = false;
  document.getElementById('saveDot').className = 'dot saved';
  document.getElementById('saveMsg').textContent = 'Opened ' + (filename||'file');
  const n = S.data.clientName || [S.data.d_First,S.data.d_Last].filter(Boolean).join(' ');
  document.getElementById('clientTag').textContent = n ? ('· '+n) : '';
  renderStep();
}

function ovFmt(f, raw){
  if(raw==='' || raw==null) return '';
  switch(f.t){
    case 'money': return money(num(raw));
    case 'cks':   return Array.isArray(raw) ? raw.join(', ') : '';
    case 'ck':    return raw ? 'Yes' : '';
    default:      return String(raw);
  }
}

/* collect {label, value} rows out of a field list */
function ovRows(fields, ctx, out, prefix){
  fields.forEach(f=>{
    if(!fieldVisible(f,ctx)) return;
    switch(f.t){
      case 'h': case 'note': case 'legal': case 'dualhead': case 'review': case 'addrow': break;

      case 'block':
        if(f.showIf && !f.showIf(S.data,ctx.item)) break;
        ovRows(f.fields, ctx, out, (prefix?prefix+' · ':'') + f.l);
        break;

      case 'rep': {
        const arr = gv(P(ctx,f.id)) || [];
        arr.forEach((item,i)=>{
          const touched = Object.values(item||{}).some(v=>v!=='' && v!=null && !(Array.isArray(v)&&!v.length));
          if(!touched) return;
          out.push({sub:`${f.l} ${i+1}`});
          ovRows(f.fields, {base:P(ctx,f.id)+'.'+i+'.', item}, out, '');
        });
        break;
      }
      case 'hg': {
        f.items.forEach(it=>{
          if(!hgHas(it[0])) return;
          const x = S.data['hg_'+it[0]+'_x'];
          out.push({label: it[1] + (x?` (${x})`:''), value: money(num(S.data['hg_'+it[0]+'_v']))});
        });
        break;
      }
      case 'docs':
        f.items.forEach(it=>{
          const plain = String(it[1]).replace(/<[^>]+>/g,'');
          out.push({label:plain, value:S.data['doc_'+it[0]] ? 'Received' : ''});
        });
        break;
      case 'stmts':
        f.items.forEach(it=>{
          out.push({label:it[1]+' initials', value:S.data['stm_'+it[0]]||''});
        });
        break;
      case 'mtx': {
        const rows = f.rows || [['ind','Individual'],['sp','Spouse']];
        rows.forEach(r=>{
          f.months.forEach(c=>{
            const v = S.data[`${f.id}_${r[0]}_${c[0]}`];
            if(v==='' || v==null) return;
            out.push({label:`${r[1]} — ${c[1]}`, value:money(num(v))});
          });
          const t = mtxRowTotal(f, r[0]);
          if(t) out.push({label:`${r[1]} — six-month total`, value:money(t), strong:true});
        });
        break;
      }
      case 'dual': {
        const a = gv(P(ctx,f.id)+'_d'), b = gv(P(ctx,f.id)+'_s');
        let lab = f.l;
        if(f.labelField && gv(P(ctx,f.labelField))) lab += ': ' + gv(P(ctx,f.labelField));
        const fmt = v => f.kind==='money' ? ((v===''||v==null)?'':money(num(v))) : (v||'');
        if(a!=='' && a!=null) out.push({label:lab, value:fmt(a)});
        if(b!=='' && b!=null) out.push({label:lab+' (spouse)', value:fmt(b)});
        break;
      }
      case 'dualtotal':
        out.push({label:f.l, value:money(f.fnA(S.data)), strong:true});
        if(f.fnB(S.data)) out.push({label:f.l+' (spouse)', value:money(f.fnB(S.data)), strong:true});
        break;
      case 'grandtotal':
        out.push({label:f.l, value:money(f.fn(S.data)), strong:true});
        break;
      case 'sig':
        if(f.showIf && !f.showIf(S.data)) break;
        out.push({label:'Print name — '+f.l, value:S.data[f.nameId]||''});
        out.push({label:'Signed — '+f.l,     value:S.data[f.id]||''});
        out.push({label:'Date — '+f.l,       value:S.data[f.dateId]||''});
        break;
      default:
        if(!f.id) break;
        out.push({label:(prefix?prefix+' · ':'') + (f.l||f.id), value:ovFmt(f, gv(P(ctx,f.id)))});
    }
  });
}

function ovGroupRows(grp){
  const out = [];
  grp.steps.forEach(sid=>{
    const st = STEPS.find(s=>s.id===sid);
    if(!st) return;
    if(st.showIf && !st.showIf(S.data)) return;
    st.sections.forEach(sec=>{
      if(!secVisible(sec)) return;
      if(grp.onlyAttorney && !sec.attorney) return;
      if(grp.skipAttorney && sec.attorney) return;
      if(sec.none && S.data[sec.none]){
        out.push({sub:sec.title}); out.push({label:sec.title, value:'None', muted:true});
        return;
      }
      const before = out.length;
      const rows = [];
      ovRows(sec.fields, {base:'', item:S.data}, rows, '');
      if(sec.totalId && S.data[sec.totalId])
        rows.push({label:'Category total', value:money(num(S.data[sec.totalId])), strong:true});
      else if(sec.totalFn && sec.totalFn(S.data))
        rows.push({label:'Category total', value:money(sec.totalFn(S.data)), strong:true});
      if(rows.some(r=>r.sub || (r.value!=='' && r.value!=null))){
        if(sec.title) out.push({sub:sec.title});
        rows.forEach(r=>out.push(r));
      } else { out.length = before; }
    });
  });
  return out;
}

function renderOfficeView(){
  const showBlanks = !!S.ovBlanks;
  let out = `<div class="callout info no-print"><b>Office view.</b> The same answers, reordered the way
    the schedules ask for them, with a copy button beside each value. Toggle blanks on to see what the
    client left empty.
    <label style="display:inline-flex;gap:7px;align-items:center;margin-left:14px;cursor:pointer">
      <input type="checkbox" id="ovBlanks"${showBlanks?' checked':''} style="accent-color:var(--navy)">
      Show blank fields</label></div>`;

  OFFICE_ORDER.forEach(grp=>{
    if(grp.onlyAttorney && !BUILD.attorneyMode) return;
    const rows = ovGroupRows(grp);
    const shown = rows.filter(r => r.sub || showBlanks || (r.value!=='' && r.value!=null));
    const hasValues = shown.some(r=>!r.sub && !r.strong && r.value!=='' && r.value!=null);
    if(!hasValues) return;

    const plain = shown.filter(r=>!r.sub && r.value)
                       .map(r=>`${r.label}: ${r.value}`).join('\n');
    out += `<div class="ov-grp"><h3>${esc(grp.title)}
      <button type="button" class="cpall" data-copyall="${esc(plain)}">Copy section</button></h3>`;
    if(grp.note) out += `<div class="ov-note">${esc(grp.note)}</div>`;
    out += '<table class="ov">';
    shown.forEach(r=>{
      if(r.sub){ out += `<tr><td colspan="3" class="ov-sub">${esc(r.sub)}</td></tr>`; return; }
      const blank = (r.value==='' || r.value==null);
      out += `<tr><td class="k">${esc(r.label)}</td>`+
             `<td class="v${blank?' blank':''}"${r.strong?' style="color:var(--navy)"':''}>${blank?'not answered':esc(r.value)}</td>`+
             `<td class="c">${blank?'':`<button type="button" class="cpbtn" data-copy="${esc(r.value)}">copy</button>`}</td></tr>`;
    });
    out += '</table></div>';
  });
  return out;
}

/* ---------- clipboard, with a fallback for non-secure contexts ---------- */
function copyText(text, btn){
  const done = ()=>{
    if(!btn) return;
    const old = btn.textContent;
    btn.textContent = 'copied'; btn.classList.add('done');
    setTimeout(()=>{ btn.textContent = old; btn.classList.remove('done'); }, 1200);
  };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallback());
  } else fallback();

  function fallback(){
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:-1000px;left:-1000px';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){}
    ta.remove();
  }
}

document.addEventListener('click', ev=>{
  const c = ev.target.closest('[data-copy]');
  if(c){ copyText(c.getAttribute('data-copy'), c); return; }
  const a = ev.target.closest('[data-copyall]');
  if(a){ copyText(a.getAttribute('data-copyall'), a); return; }
  const j = ev.target.closest('[data-jump]');
  if(j){ jumpToField(+j.getAttribute('data-step'), j.getAttribute('data-jump')); return; }
  const t = ev.target.closest('[data-ovmode]');
  if(t){ S.officeView = t.getAttribute('data-ovmode')==='office'; renderStep(); return; }
});
document.addEventListener('change', ev=>{
  if(ev.target && ev.target.id==='ovBlanks'){ S.ovBlanks = ev.target.checked; renderStep(true); }
});

   SEND TO THE OFFICE
   On a phone this hands the finished file straight to the share
   sheet with the file already attached — one tap, no hunting in
   Downloads. On a computer it downloads the file and opens a
   pre-addressed email, because browsers will not let a web page
   attach a file to mail on its own.
   ============================================================ */

function canShareFiles(file){
  try{ return !!(navigator.canShare && navigator.share && navigator.canShare({files:[file]})); }
  catch(e){ return false; }
}

function clientLabel(){
  return S.data.clientName || [S.data.d_First,S.data.d_Last].filter(Boolean).join(' ') || 'client';
}

function mailtoLink(name){
  const subject = `Bankruptcy questionnaire — ${clientLabel()}`;

    `${clientLabel()}\n`;
  return `mailto:${FIRM.email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}

        <div class="merr" id="mErr"></div>

    document.body.appendChild(bg);

    bg.querySelector('#btnShareNow').addEventListener('click', function(){
      navigator.share({ files:[file],
                        title:`Bankruptcy questionnaire — ${clientLabel()}`,
                        text:`Completed questionnaire for ${clientLabel()}.` })
        .then(()=>{ bg.remove(); resolve('shared'); })
        .catch(err=>{
          if(err && err.name==='AbortError'){ return; }         /* they backed out of the sheet */
          bg.querySelector('#mErr').textContent =
            'This device would not open the share menu. Use “Back”, then save the file and email it.';
        });
    });
    bg.querySelector('#btnShareCancel').addEventListener('click', ()=>{ bg.remove(); resolve('cancel'); });
  });
}

async function doSend(){
  const r = await buildSaveBlob();
  if(!r) return;

  const file = new File([r.blob], r.name, {type:'application/json'});

  if(canShareFiles(file)){
    const outcome = await shareSheet(file, r.locked);
    if(outcome==='shared'){
      markSaved('Sent — ' + r.name);
      await modal({ title:'On its way',
        body:`<p>Your questionnaire has been handed to your mail or messaging app. Check that it
              actually sent — some apps leave it sitting in a draft.</p>
              ${r.locked?`<p><b>Now call ${esc(FIRM.phone)} with the password.</b></p>`:''}`,
        buttons:[{label:'Done', cls:'gold', value:null}]});
      return;
    }
    if(outcome==='cancel') return;
  }

  /* Desktop: download, then open a pre-addressed email. */
  downloadBlob(r.blob, r.name);
  markSaved(r.name + (r.locked?'  \u{1F512}':''));

  const go = await modal({
    title:'Two quick steps',
    body:`<p><b>1.</b> Your file has just downloaded:<br>
            <code style="font-size:13px">${esc(r.name)}</code><br>
            <span style="font-size:12.5px;color:var(--ink-3)">Look in your Downloads folder.</span></p>
          <p><b>2.</b> We will open an email to <b>${esc(FIRM.email)}</b> — attach that file to it and send.</p>
          ${r.locked?`<p class="lockprompt"><b>Then call ${esc(FIRM.phone)} with the password.</b>
            Do not put it in the same email.</p>`:''}`,
    buttons:[
      {label:'Open my email', cls:'gold', value:'mail'},
      {label:'I will send it myself', value:null}
    ]
  });
  if(go==='mail'){
    const a = document.createElement('a');
    a.href = mailtoLink(r.name);
    document.body.appendChild(a); a.click(); a.remove();
  }
}

/* the card that appears on the review page */
function renderSendCard(){
  const blanks = auditBlanks().length;
  return `<div class="sendcard no-print">
    <div class="sc-text">
      <h3>Send your answers to ${esc(FIRM.name)}</h3>
      <p>${blanks
        ? `There ${blanks===1?'is':'are'} still <b>${blanks}</b> blank ${blanks===1?'answer':'answers'} above.
           You can send anyway, but we will have to come back to you for them.`
        : `Everything that applies to you has been answered.`}
        On a phone this opens your normal share menu with the file already attached.
        On a computer the file downloads and your email opens.</p>
    </div>
    <button type="button" class="btn gold sc-btn" id="btnSend">Send to the office</button>
  </div>
  <p class="legal no-print" style="margin-top:10px">
    Want a copy for your own records? Press <b>Download PDF</b> at the top of the page and
    choose <b>Save as PDF</b> as the destination.
  </p>`;
}

document.addEventListener('click', ev=>{
  if(ev.target && ev.target.id==='btnSend') doSend();
});

</script>
