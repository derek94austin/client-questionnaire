<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Client Questionnaire — Schumacher Lane, PLLC</title>
<style>
:root{
  --navy:#12233d; --navy-2:#1c3557; --navy-3:#2a4a76;
  --gold:#b3892f; --gold-lt:#d9b45f;
  --ink:#16202e; --ink-2:#41505f; --ink-3:#6b7a8b;
  --line:#d8dee6; --line-2:#e9edf2;
  --bg:#eef1f5; --panel:#ffffff; --panel-2:#f7f9fb;
  --ok:#1c7a4d; --ok-bg:#e7f4ed;
  --warn:#9a6a06; --warn-bg:#fdf5e3;
  --err:#a32323; --err-bg:#fbecec;
  --r:8px; --sh:0 1px 2px rgba(16,32,56,.06),0 4px 14px rgba(16,32,56,.06);
  --fs:15px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:var(--fs); line-height:1.5; color:var(--ink); background:var(--bg);
  -webkit-text-size-adjust:100%;
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--navy-3)}

/* ---------- App shell ---------- */
#app{display:flex;flex-direction:column;min-height:100vh}

header.top{
  background:var(--navy); color:#fff; position:sticky; top:0; z-index:50;
  box-shadow:0 2px 10px rgba(10,20,35,.28);
}
.top-in{max-width:1400px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.15;margin-right:auto;min-width:0}
.brand .firm{font-size:17px;font-weight:700;letter-spacing:.02em;font-variant:small-caps}
.brand .sub{font-size:11px;color:#9fb2cc;letter-spacing:.06em;text-transform:uppercase}
.top-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{
  border:1px solid transparent;border-radius:6px;padding:8px 14px;font-size:13.5px;font-weight:600;
  cursor:pointer;background:#fff;color:var(--navy);white-space:nowrap;transition:.12s;
}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:rgba(255,255,255,.09);color:#fff;border-color:rgba(255,255,255,.28)}
.btn.ghost:hover{background:rgba(255,255,255,.18)}
.btn.gold{background:var(--gold);color:#231a05;border-color:var(--gold)}
.btn.gold:hover{background:var(--gold-lt)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.danger{background:#fff;color:var(--err);border-color:#e3bcbc}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

.savebar{background:var(--navy-2);color:#cfe0f5;font-size:12.5px}
.savebar-in{max-width:1400px;margin:0 auto;padding:6px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.savebar b{color:#fff}
.dot{width:8px;height:8px;border-radius:50%;background:#7f8fa5;display:inline-block;margin-right:6px}
.dot.unsaved{background:var(--gold-lt);box-shadow:0 0 0 3px rgba(217,180,95,.2)}
.dot.saved{background:#5fd39b}

/* ---------- opt-in browser autosave ---------- */
.autosave-ctl{display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap}
.as-toggle{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none;
  border:1px solid rgba(255,255,255,.28);border-radius:5px;padding:3px 9px;background:rgba(255,255,255,.06)}
.as-toggle:hover{background:rgba(255,255,255,.14)}
.as-toggle input{accent-color:var(--gold-lt);width:14px;height:14px;margin:0}
.btn.as-clear{background:rgba(255,255,255,.09);color:#fff;border-color:rgba(255,255,255,.28);padding:3px 9px;font-size:12px}
.btn.as-clear:hover{background:rgba(255,255,255,.18)}
.as-stamp{color:#9fb2cc;font-size:12px}

.restore-bar{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  background:#fff;border:1px solid var(--gold);border-left:4px solid var(--gold);
  border-radius:var(--r);padding:12px 16px;margin-bottom:14px;box-shadow:var(--sh);font-size:13.5px;
}
.restore-bar .rb-btns{display:flex;gap:8px;margin-left:auto}

/* ---------- Layout ---------- */
.wrap{max-width:1400px;margin:0 auto;padding:20px 18px 120px;display:grid;grid-template-columns:270px 1fr;gap:24px;width:100%}

/* ---------- Sidebar ---------- */
nav.side{position:sticky;top:96px;align-self:start;max-height:calc(100vh - 120px);overflow:auto}
.side-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.side-head{padding:12px 14px;border-bottom:1px solid var(--line-2);background:var(--panel-2)}
.side-head .pct{font-size:22px;font-weight:700;color:var(--navy)}
.side-head .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
.bar{height:6px;background:var(--line-2);border-radius:99px;overflow:hidden;margin-top:8px}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--navy-3),var(--gold));width:0;transition:width .3s}
ol.steps{list-style:none;margin:0;padding:6px}
ol.steps li{margin:0}
ol.steps button{
  width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:8px 10px;cursor:pointer;
  display:flex;gap:9px;align-items:flex-start;font-size:13.5px;color:var(--ink-2);line-height:1.3;
}
ol.steps button:hover{background:var(--panel-2)}
ol.steps button.active{background:var(--navy);color:#fff;font-weight:600}
ol.steps button.active .num{background:rgba(255,255,255,.22);color:#fff;border-color:transparent}
.num{
  flex:0 0 auto;width:21px;height:21px;border-radius:5px;border:1px solid var(--line);
  display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--ink-3);background:#fff;margin-top:1px;
}
ol.steps button.done .num{background:var(--ok-bg);color:var(--ok);border-color:#bfe0cf}
ol.steps button.done.active .num{background:rgba(255,255,255,.22);color:#fff}
.side-foot{padding:10px 14px;border-top:1px solid var(--line-2);font-size:12px;color:var(--ink-3)}

.mobnav{display:none}

/* ---------- Main ---------- */
main.main{min-width:0}
.step-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.step-head{padding:18px 22px;border-bottom:2px solid var(--navy);background:linear-gradient(180deg,#fff,var(--panel-2))}
.step-head .eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:700}
.step-head h1{margin:3px 0 0;font-size:23px;letter-spacing:-.01em;color:var(--navy)}
.step-head p{margin:7px 0 0;color:var(--ink-2);font-size:14px;max-width:70ch}
.step-body{padding:20px 22px}

/* ---------- Sections & fields ---------- */
.sec{margin:0 0 26px}
.sec:last-child{margin-bottom:6px}
.sec-h{
  display:flex;align-items:center;gap:10px;margin:0 0 4px;
  font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--navy);
}
.sec-h::after{content:"";flex:1;height:1px;background:var(--line)}
.sec-h .idx{
  background:var(--navy);color:#fff;border-radius:5px;min-width:22px;height:20px;padding:0 5px;
  display:grid;place-items:center;font-size:11px;letter-spacing:0;
}
.sec-note{font-size:13px;color:var(--ink-2);margin:6px 0 12px;max-width:78ch}
.sec-body{margin-top:12px}

.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px 14px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f > label,.f > .lbl{font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:.02em;line-height:1.3}
.f .hint{font-size:11.5px;color:var(--ink-3);font-weight:400}
.f input[type=text],.f input[type=tel],.f input[type=email],.f input[type=date],.f input[type=number],.f select,.f textarea{
  width:100%;border:1px solid var(--line);border-radius:6px;padding:9px 10px;background:#fff;
  font-size:14.5px;transition:.12s;min-height:38px;
}
.f textarea{min-height:70px;resize:vertical;line-height:1.45}
.f input:focus,.f select:focus,.f textarea:focus{
  outline:none;border-color:var(--navy-3);box-shadow:0 0 0 3px rgba(42,74,118,.13)
}
.f input::placeholder{color:#a9b4c1}
.money-wrap{position:relative}
.money-wrap::before{content:"$";position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-size:14px}
.money-wrap input{padding-left:22px !important;text-align:right}
.suffix-wrap{position:relative}
.suffix-wrap > .sfx{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-size:12px;pointer-events:none}
.suffix-wrap input{padding-right:44px !important}

/* choice controls */
.choice{display:flex;flex-wrap:wrap;gap:7px}
.choice label{
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:6px;
  padding:7px 12px;cursor:pointer;background:#fff;font-size:13.5px;transition:.12s;user-select:none;
}
.choice label:hover{border-color:var(--navy-3);background:var(--panel-2)}
.choice input{accent-color:var(--navy);margin:0;width:15px;height:15px}
.choice label.on{border-color:var(--navy);background:#eef3fa;font-weight:600;color:var(--navy)}
.choice.yn label{min-width:74px;justify-content:center}
.choice.cols3{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.choice.cols2{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}

.cbline{display:flex;align-items:flex-start;gap:9px;padding:7px 0}
.cbline input{margin-top:3px;accent-color:var(--navy);width:16px;height:16px;flex:0 0 auto}
.cbline label{font-size:14px;line-height:1.45;cursor:pointer}

.none-toggle{
  display:inline-flex;align-items:center;gap:8px;border:1px dashed var(--line);border-radius:6px;
  padding:7px 13px;cursor:pointer;background:var(--panel-2);font-size:13px;color:var(--ink-2);user-select:none;
}
.none-toggle input{accent-color:var(--navy);width:15px;height:15px;margin:0}
.none-toggle.on{background:#eef3fa;border:1px solid var(--navy);color:var(--navy);font-weight:600}

/* dual (debtor / spouse) */
.dual{display:grid;grid-template-columns:minmax(180px,1.4fr) 1fr 1fr;gap:10px;align-items:center;
  padding:6px 8px;border-radius:6px}
.dual:nth-of-type(odd){background:var(--panel-2)}
.dual > .dl{font-size:13.5px;color:var(--ink);line-height:1.3}
.dual > .dl small{display:block;color:var(--ink-3);font-size:11.5px}
.dualhead{display:grid;grid-template-columns:minmax(180px,1.4fr) 1fr 1fr;gap:10px;padding:0 8px 6px;
  font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:700;
  border-bottom:1px solid var(--line);margin-bottom:6px;position:sticky;top:88px;background:#fff;z-index:5}
.dualhead > :first-child{visibility:hidden}
.dual input,.dual select{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px 9px;font-size:14px;min-height:34px}
.dual input:focus,.dual select:focus{outline:none;border-color:var(--navy-3);box-shadow:0 0 0 3px rgba(42,74,118,.13)}
.dual .money-wrap input{text-align:right}
.dual-total{display:grid;grid-template-columns:minmax(180px,1.4fr) 1fr 1fr;gap:10px;padding:10px 8px;margin-top:8px;
  border-top:2px solid var(--navy);font-weight:700;align-items:center}
.dual-total .tv{text-align:right;padding-right:10px;font-variant-numeric:tabular-nums;color:var(--navy);font-size:16px}

/* repeaters */
.rep-item{border:1px solid var(--line);border-radius:var(--r);margin:0 0 12px;background:#fff;overflow:hidden}
.rep-head{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel-2);border-bottom:1px solid var(--line-2)}
.rep-head .rt{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--navy)}
.rep-head .rs{font-size:12.5px;color:var(--ink-3);margin-right:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rep-body{padding:14px}
.rep-add{display:flex;gap:10px;align-items:center;margin-top:2px}
.rep-empty{color:var(--ink-3);font-size:13px;font-style:italic;padding:8px 0}

/* sub-block inside repeater / nested */
.block{border:1px solid var(--line-2);border-left:3px solid var(--navy-3);border-radius:6px;padding:12px;margin:12px 0;background:var(--panel-2)}
.block > .bt{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--navy-3);margin-bottom:10px}

/* checklist-with-value rows (household goods) */
.hg{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:4px 18px}
.hg-row{display:grid;grid-template-columns:18px 1fr 84px 96px;gap:8px;align-items:center;padding:4px 6px;border-radius:5px}
.hg-row:hover{background:var(--panel-2)}
.hg-row input[type=checkbox]{accent-color:var(--navy);width:16px;height:16px;margin:0}
.hg-row .hl{font-size:13.5px;line-height:1.25}
.hg-row input[type=text]{border:1px solid var(--line);border-radius:5px;padding:5px 7px;font-size:13px;min-height:30px;width:100%}
.hg-row .money-wrap::before{font-size:12.5px;left:7px}
.hg-row .money-wrap input{padding-left:17px !important}

/* means-test / matrix grid */
.mtx-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table.mtx{border-collapse:collapse;width:100%;min-width:680px;font-size:13px}
table.mtx th,table.mtx td{border:1px solid var(--line-2);padding:0}
table.mtx th{background:var(--panel-2);color:var(--ink-2);font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:7px 8px;font-weight:700;text-align:center}
table.mtx th.rh{text-align:left;min-width:96px}
table.mtx td.rh{background:var(--panel-2);font-weight:600;padding:7px 8px;font-size:12.5px;white-space:nowrap}
table.mtx input{border:0;width:100%;padding:8px 8px;text-align:right;font-size:13.5px;min-height:36px;background:transparent}
table.mtx input:focus{outline:2px solid var(--navy-3);outline-offset:-2px;background:#fff;border-radius:3px}
table.mtx td.tot{background:#f2f6fb;text-align:right;padding:7px 9px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}

/* callouts */
.callout{border-radius:var(--r);padding:13px 15px;font-size:13.5px;line-height:1.55;margin:0 0 16px;border:1px solid}
.callout.info{background:#eef3fa;border-color:#c9d9ee;color:#1b3454}
.callout.warn{background:var(--warn-bg);border-color:#e8d5a4;color:#6b4b06}
.callout.priv{background:var(--ok-bg);border-color:#bfe0cf;color:#12563a}
.callout b{font-weight:700}
.callout ul{margin:7px 0 0;padding-left:20px}
.callout li{margin:3px 0}

.total-strip{
  display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  background:var(--navy);color:#fff;border-radius:var(--r);padding:12px 16px;margin-top:14px
}
.total-strip .tl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#a9c0dd}
.total-strip .tv{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}

.subtotal{display:flex;justify-content:flex-end;align-items:baseline;gap:12px;margin-top:10px;
  border-top:1px solid var(--line);padding-top:9px}
.subtotal .sl{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:700}
.subtotal .sv{font-size:17px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}

/* footer nav */
.stepnav{display:flex;gap:10px;align-items:center;padding:16px 22px;border-top:1px solid var(--line-2);background:var(--panel-2);flex-wrap:wrap}
.stepnav .spacer{flex:1}
.btn.nav{background:var(--navy);color:#fff;padding:11px 22px;font-size:14.5px}
.btn.nav:hover{background:var(--navy-2)}
.btn.nav.back{background:#fff;color:var(--navy);border-color:var(--line)}

.attorney-only{display:none}
body.attorney .attorney-only{display:block}
.att-badge{display:inline-block;background:var(--warn-bg);color:var(--warn);border:1px solid #e8d5a4;
  border-radius:4px;padding:2px 7px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-left:8px}

.hidden{display:none !important}

/* signature */
.sigbox{border:1px solid var(--line);border-radius:var(--r);padding:16px;background:var(--panel-2)}
.sigline input{font-family:"Segoe Script","Brush Script MT",cursive;font-size:22px !important;letter-spacing:.02em}

/* review / print */
#review .rv-sec{margin-bottom:18px}
#review h2{font-size:15px;color:var(--navy);border-bottom:2px solid var(--navy);padding-bottom:5px;margin:22px 0 10px;
  text-transform:uppercase;letter-spacing:.05em}
#review h3{font-size:13px;color:var(--navy-3);margin:14px 0 6px;letter-spacing:.03em}
#review table{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:8px}
#review td{border-bottom:1px solid var(--line-2);padding:5px 8px;vertical-align:top}
#review td.k{width:44%;color:var(--ink-2);font-weight:600}
#review td.v{color:var(--ink)}
#review td.v.empty{color:#b4bdc7;font-style:italic}
.rv-print-head{display:none}

@media (max-width:1080px){
  .wrap{grid-template-columns:1fr;padding:14px 12px 110px;gap:14px}
  nav.side{display:none}
  .mobnav{display:block}
  .mobnav select{width:100%;padding:11px;border:1px solid var(--line);border-radius:var(--r);background:#fff;font-size:14.5px;font-weight:600;color:var(--navy)}
  .dualhead{top:0}
  .step-body{padding:16px 14px}
  .step-head{padding:16px 14px}
  .stepnav{padding:14px}
  .dual,.dualhead,.dual-total{grid-template-columns:1fr;gap:6px}
  .dualhead{display:none}
  .dual{border:1px solid var(--line-2);margin-bottom:8px;padding:10px}
  .dual > .dl{font-weight:600}
  .dual .dcell::before{content:attr(data-who);display:block;font-size:10.5px;text-transform:uppercase;
    letter-spacing:.07em;color:var(--ink-3);font-weight:700;margin-bottom:3px}
  .dual-total{grid-template-columns:1fr}
  .hg-row{grid-template-columns:18px 1fr 78px 90px}
}
@media (max-width:560px){
  .top-in{padding:9px 12px}
  .brand .firm{font-size:15px}
  .btn{padding:7px 11px;font-size:12.5px}
  .hg{grid-template-columns:1fr}
}

@media print{
  body{background:#fff;font-size:10.5pt}
  header.top,.savebar,nav.side,.mobnav,.stepnav,.no-print,.step-head{display:none !important}
  .wrap{display:block;padding:0;max-width:none}
  .step-card{border:0;box-shadow:none}
  .step-body{padding:0}
  .rv-print-head{display:block;text-align:center;margin-bottom:14px;border-bottom:2px solid #000;padding-bottom:8px}
  .rv-print-head .f1{font-size:16pt;font-weight:700;font-variant:small-caps}
  .rv-print-head .f2{font-size:9pt}
  #review h2,#review h3{page-break-after:avoid;break-after:avoid}
  #review .rv-sec{break-inside:auto}
  #review table{page-break-inside:auto}
  #review tr{page-break-inside:avoid}
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="top-in">
      <div class="brand">
        <span class="firm" id="brandFirm">Schumacher Lane, PLLC</span>
        <span class="sub" id="brandSub">Client Questionnaire</span>
      </div>
      <div class="top-actions">
        <button class="btn ghost sm" id="btnLoad">Open saved file</button>
        <button class="btn ghost sm" id="btnPrint">Print / PDF</button>
        <button class="btn gold" id="btnSave">Save my answers</button>
        <input type="file" id="fileIn" accept=".json,.slq,application/json" style="display:none">
      </div>
    </div>
  </header>
  <div class="savebar">
    <div class="savebar-in">
      <span><span class="dot" id="saveDot"></span><span id="saveMsg">Nothing entered yet</span></span>
      <span id="clientTag"></span>
      <span style="margin-left:auto" class="no-print">Your answers stay on this device until you save a file and send it to us.</span>
    </div>
  </div>

  <div class="wrap">
    <nav class="side">
      <div class="side-card">
        <div class="side-head">
          <div class="lbl">Completed</div>
          <div class="pct" id="pctNum">0%</div>
          <div class="bar"><i id="pctBar"></i></div>
        </div>
        <ol class="steps" id="stepList"></ol>
        <div class="side-foot">
          Questions? Call <b>503-482-8137</b><br>kyle@schumacherlane.com
        </div>
      </div>
    </nav>

    <main class="main">
      <div class="mobnav no-print" style="margin-bottom:12px">
        <select id="mobSelect"></select>
      </div>
      <div class="step-card">
        <div class="step-head" id="stepHead"></div>
        <div class="step-body" id="stepBody"></div>
        <div class="stepnav no-print">

<script>
/* ============================================================

/* ---------- build flags (rewritten by the build script) ---------- */
const BUILD = { attorneyMode:false, autosave:true, label:'client' };

/* ---------- schema shorthand ---------- */
const T   = (id,l,w,o)      => ({t:'text', id,l, w:w||4, ...o});

const TA  = (id,l,w,o)      => ({t:'ta',   id,l, w:w||12,...o});
const YN  = (id,l,w,o)      => ({t:'yn',   id,l, w:w||6, ...o});
const SEL = (id,l,opts,w,o) => ({t:'sel',  id,l, opts, w:w||4, ...o});
const RAD = (id,l,opts,w,o) => ({t:'rad',  id,l, opts, w:w||12,...o});
const CKS = (id,l,opts,w,o) => ({t:'cks',  id,l, opts, w:w||12,...o});
const CK  = (id,l,w,o)      => ({t:'ck',   id,l, w:w||12,...o});
const H   = (l,o)           => ({t:'h', l, ...o});

const US_STATES = ["AL","AK","AZ","AR","CA","CO","CT","DE","DC","FL","GA","HI","ID","IL","IN","IA","KS","KY","LA","ME","MD","MA","MI","MN","MS","MO","MT","NE","NV","NH","NJ","NM","NY","NC","ND","OH","OK","OR","PA","PR","RI","SC","SD","TN","TX","UT","VT","VA","WA","WV","WI","WY"];
const ST  = (id,l,w,o)      => ({t:'sel', id, l:l||'State', opts:US_STATES, w:w||2, ...o});

/* address cluster: prefix -> Addr / City / State / Zip */
const ADDR = (p,lbl) => ([
  T(p+'Addr', (lbl||'')+'Street Address', 6),
  T(p+'City','City',3), ST(p+'State','State',1), T(p+'Zip','ZIP',2)
]);

/* a full secured-lien block (mortgages, mobile-home loans) */
const LIEN = (p,title) => ({t:'block', l:title, fields:[
  T(p+'Name','Lender / Mortgage Name',6), T(p+'Acct','Account Number',6),
  ...ADDR(p+'','Lender Mailing Address'),
  T(p+'Obtained','Date Obtained (mm/yyyy)',3), M(p+'Payoff','Payoff Amount',3),
  MO(p+'Pmt','Monthly Payment',3), PCT(p+'Rate','Interest Rate',3),
  YN(p+'TaxInc','Are property TAXES included in the payment?',6,{rerender:true}),
  M(p+'TaxAmt','If no — taxes per year',6,{sfx:'/yr', showIf:(d,it)=>it[p+'TaxInc']==='No'}),
  YN(p+'InsInc','Is INSURANCE included in the payment?',6,{rerender:true}),
  M(p+'InsAmt','If no — insurance per year',6,{sfx:'/yr', showIf:(d,it)=>it[p+'InsInc']==='No'}),
  RAD(p+'Intent','What do you intend to do with this property?',['Keep','Surrender'],6),
  YN(p+'Behind','Are you behind on payments?',6,{rerender:true}),
  NUM(p+'BehindNo','If behind — number of payments behind',3,{showIf:(d,it)=>it[p+'Behind']==='Yes'}),
  M(p+'Catchup','Amount needed to catch up',3,{showIf:(d,it)=>it[p+'Behind']==='Yes'}),
  YN(p+'Foreclosed','Has a foreclosure been filed?',6)
]});

/* value-checklist row set for household goods */
const HGITEM = (id,label,extra) => ({id,label,extra:extra||null});
/* ============================================================
   SCHEMA — Part A : intro, filers, real property, mobile home
   ============================================================ */

const PERSON = (p, who, isJoint) => ([
  T(p+'First','First Name',4), T(p+'Middle','Middle Name',4), T(p+'Last','Last Name',4),
  SEL(p+'Suffix','Suffix',['','Jr.','Sr.','II','III','IV'],2),
  T(p+'OtherNames','Other names used within the last 8 years',10,
    {hint:'Maiden names, married names, nicknames used on accounts, DBAs. Write "None" if none.'}),
  T(p+'SSN','Social Security Number',4,{hint:'List all if you have more than one.'}),
  H('Where '+(isJoint?'they live':'you live')),
  T(p+'Addr','Street Address',7), T(p+'Apt','Apt. No.',2), T(p+'City','City',3),

  T(p+'County','County of Residence',4,{hint:'County, not city.'}),

  YN(p+'MailDiff','Is the mailing address different from the street address?',12,{rerender:true}),
  T(p+'MailAddr','Mailing Address',7,{showIf:(d,it)=>it[p+'MailDiff']==='Yes'}),
  T(p+'MailApt','Apt. No.',2,{showIf:(d,it)=>it[p+'MailDiff']==='Yes'}),
  T(p+'MailCity','City',3,{showIf:(d,it)=>it[p+'MailDiff']==='Yes'}),
  ST(p+'MailState','State',2,{showIf:(d,it)=>it[p+'MailDiff']==='Yes'}),
  T(p+'MailZip','ZIP Code',2,{showIf:(d,it)=>it[p+'MailDiff']==='Yes'}),
  H('How to reach '+(isJoint?'them':'you')),
  TEL(p+'Home','Home Telephone',3), TEL(p+'Work','Work Telephone',3),
  TEL(p+'Cell','Cellular Telephone',3), EM(p+'Email','E-mail Address',3),
  RAD(p+'BestNum','Best number to contact',['Home','Work','Cellular'],6),

    {showIf:(d,it)=>it[p+'PriorBK']==='Yes'}),
  YN(p+'Same180','Have you resided in the same county for the last 180 days (6 months)?',7,{rerender:true}),
  T(p+'PriorCounty','If no — where did you live prior?',5,{showIf:(d,it)=>it[p+'Same180']==='No'})
]);

const STEPS = [];

/* ---------- 1. Start here ---------- */
STEPS.push({
  id:'start', title:'Start Here', eyebrow:'Before you begin',
  intro:'This questionnaire replaces the paper packet. Take your time — you can stop at any point, save your answers to a file, and pick up where you left off.',
  sections:[
    {title:'How this works', fields:[
      NOTE('<b>Your answers never leave this device.</b> Nothing is uploaded or transmitted while you type. When you are finished, press <b>Save my answers</b> — that downloads a single file to your computer, which you then send to our office. You can reopen that file here at any time to correct or add to your answers.','priv'),
      NOTE('<b>Federal law requires that everything in your petition be complete, accurate and truthful.</b> You must list <i>all</i> assets — everything in your possession. Even if you still owe money on something, the property is still yours and its value must be disclosed. When listing the value of personal property, give the <b>“yard sale” value</b> — what it would sell for used, not what it would cost to replace.','warn'),
      NOTE('<b>Do not leave blanks.</b> If a question does not apply to you, check the <b>“None”</b> box or write “N/A”. Blank answers slow your case down more than anything else.','info'),
      H('About your debts'),
      NOTE('We pull a credit report from all three bureaus to help capture your creditors. Credit reports frequently contain errors, and some debts are never reported at all — so we still need <b>your</b> complete list of everyone you may owe money to. Include the original creditor <i>and</i> any collection agency assigned to the account. Estimate balances as closely as you can, provide the date the debt was incurred and what it was for, and do not omit any bills. If you have been sued, send us a copy of the lawsuit. Tell us about any debt you are interested in paying after bankruptcy.','info')
    ]},
    {title:'Who is filing', fields:[
      RAD('filingType','Are you filing alone, or jointly with a spouse?',
        ['Filing alone (individual)','Filing jointly with my spouse'],12,{rerender:true}),

      D('formDate','Today’s date',3)
    ]}
  ]
});

const S = { data:{}, step:0, dirty:false, attorney:false, savedOnce:false };

/* ---------- utilities ---------- */
function num(v){ if(v===null||v===undefined||v==='') return 0;
  const n=parseFloat(String(v).replace(/[^0-9.\-]/g,'')); return isNaN(n)?0:n; }
function money(n){ const neg=n<0; n=Math.abs(n);
  return (neg?'-$':'$')+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function esc(s){ return String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function uid(){ return 'x'+Math.random().toString(36).slice(2,9); }

/* path get/set — segments separated by "."; numeric segments index arrays */
function gv(path){
  const p=path.split('.'); let o=S.data;
  for(let i=0;i<p.length;i++){ if(o==null) return undefined; o=o[p[i]]; }
  return o;
}
function sv(path,val){
  const p=path.split('.'); let o=S.data;
  for(let i=0;i<p.length-1;i++){
    const k=p[i], nk=p[i+1];
    if(o[k]==null) o[k] = /^\d+$/.test(nk)?[]:{};
    o=o[k];
  }
  o[p[p.length-1]]=val;
}

/* ---------- computed totals used by the schema ---------- */
function sumRep(d,key,field){
  const a=d[key]; if(!Array.isArray(a)) return 0;
  return a.reduce((t,o)=>t+num(o&&o[field]),0);
}
function sumHG(d){
  let t=0; HG_ITEMS.forEach(it=>{ if(d['hg_'+it[0]+'_on']) t+=num(d['hg_'+it[0]+'_v']); }); return t;
}
function ppGrandTotal(d){
  let t=0;
  ['pp1','pp2','pp3','pp4','pp5'].forEach(sid=>{
    const st=STEPS.find(s=>s.id===sid); if(!st) return;
    st.sections.forEach(sec=>{
      if(sec.none && d[sec.none]) return;
      if(sec.totalFn) t+=sec.totalFn(d);
      else if(sec.totalId) t+=num(d[sec.totalId]);
    });
  });
  return t;
}
function incTotal(d,sfx){
  let t=num(d['payNet'+sfx]);
  INC_ROWS.forEach(r=>{ t+=num(d[r[0]+sfx]); });
  return t;
}
function expTotal(d,sfx){
  let t=0;
  EXP_ROWS.forEach(r=>{ if(r[0].startsWith('__')) return; t+=num(d[r[0]+sfx]); });
  t+=num(d['expRETax'+sfx])+num(d['expHomeIns'+sfx]);
  return t;
}

/* ---------- auto-wire re-render on every field that gates another field ----------
   Any id referenced inside a showIf() closure must trigger a re-render when it
   changes, otherwise the dependent field never appears. Rather than tagging each
   one by hand, read the ids straight out of the predicate source. */
function autoRerender(){
  const gates = new Set();
  const scan = fn => {
    if(typeof fn !== 'function') return;
    const src = fn.toString();
    const re = /\b(?:d|it)(?:\.([A-Za-z_$][\w$]*)|\[\s*['"]([^'"]+)['"]\s*\])/g;
    let m; while((m = re.exec(src))) gates.add(m[1] || m[2]);
  };
  const walkFields = fs => fs.forEach(f=>{
    scan(f.showIf);
    if(f.fields) walkFields(f.fields);
  });
  STEPS.forEach(st=>{
    scan(st.showIf);
    st.sections.forEach(sec=>{ scan(sec.showIf); walkFields(sec.fields); });
  });
  const tag = fs => fs.forEach(f=>{
    if(f.id && gates.has(f.id)) f.rerender = true;
    if(f.fields) tag(f.fields);
  });
  STEPS.forEach(st=>st.sections.forEach(sec=>tag(sec.fields)));
  return gates;
}

/* ---------- visible steps ---------- */
function visibleSteps(){ return STEPS.filter(s=>!s.showIf || s.showIf(S.data)); }
function secVisible(sec){
  if(sec.attorney && !S.attorney) return false;
  if(sec.showIf && !sec.showIf(S.data)) return false;
  return true;
}

/* ============================================================
   FIELD RENDERING
   ctx = { base:'' | 'creditors.0.', item:objectOrData }
   ============================================================ */
function P(ctx,id){ return ctx.base + id; }
function V(ctx,id){ const v=gv(P(ctx,id)); return v===undefined?'':v; }

function fieldVisible(f,ctx){
  if(f.attorney && !S.attorney) return false;
  if(f.showIf && !f.showIf(S.data, ctx.item)) return false;
  return true;
}

function renderFields(fields,ctx){
  let out='<div class="grid">';
  fields.forEach(f=>{ out+=renderField(f,ctx); });
  return out+'</div>';
}

function renderField(f,ctx){
  if(!fieldVisible(f,ctx)) return '';
  const w = f.w||12, span=`grid-column:span ${w}`;
  const p = f.id?P(ctx,f.id):null;
  const rr = f.rerender?' data-rr="1"':'';
  const hint = f.hint?`<span class="hint">${f.hint}</span>`:'';
  const lbl = (txt)=>`<label for="${p}">${txt}${hint?'<br>':''}${hint}</label>`;

  switch(f.t){
    case 'h':
      return `<div class="f" style="grid-column:span 12"><div class="sec-h" style="margin-top:8px">${esc(f.l)}</div></div>`;
    case 'note':
      return `<div style="grid-column:span 12"><div class="callout ${f.k}">${f.l}</div></div>`;
    case 'legal':
      return `<div style="grid-column:span 12" class="legal">${f.l}</div>`;

    case 'text': case 'tel': case 'email': case 'num': case 'date': {
      const type = f.t==='num'?'number':(f.t==='date'?'date':(f.t==='tel'?'tel':(f.t==='email'?'email':'text')));
      const inner=`<input type="${type}" id="${p}" data-p="${p}"${rr} value="${esc(V(ctx,f.id))}"${f.ph?` placeholder="${esc(f.ph)}"`:''}>`;
      const wrapped = f.sfx?`<div class="suffix-wrap">${inner}<span class="sfx">${esc(f.sfx)}</span></div>`:inner;
      return `<div class="f" style="${span}">${lbl(esc(f.l))}${wrapped}</div>`;
    }
    case 'money': {
      const inner=`<div class="money-wrap"><input type="text" inputmode="decimal" id="${p}" data-p="${p}" data-money="1"${rr} value="${esc(V(ctx,f.id))}"></div>`;
      const sfx = f.sfx?`<span class="hint" style="text-align:right">${esc(f.sfx)}</span>`:'';
      return `<div class="f" style="${span}">${lbl(esc(f.l))}${inner}${sfx}</div>`;
    }
    case 'ta':
      return `<div class="f" style="${span}">${lbl(esc(f.l))}<textarea id="${p}" data-p="${p}"${rr}>${esc(V(ctx,f.id))}</textarea></div>`;

    case 'sel': {
      const cur=V(ctx,f.id);
      const opts=f.opts.map(o=>{
        const val=typeof o==='object'?o.v:o, txt=typeof o==='object'?o.t:o;
        return `<option value="${esc(val)}"${cur===val?' selected':''}>${esc(txt||'—')}</option>`;
      }).join('');
      return `<div class="f" style="${span}">${lbl(esc(f.l))}<select id="${p}" data-p="${p}"${rr}>${f.opts.includes('')?'':'<option value="">—</option>'}${opts}</select></div>`;
    }

    case 'yn': case 'rad': {
      const opts = f.t==='yn'?['Yes','No']:f.opts;
      const cur=V(ctx,f.id), nm=p.replace(/\./g,'_');
      const cls = f.t==='yn'?'choice yn':(opts.length>4?'choice cols2':'choice');
      const body=opts.map(o=>`<label class="${cur===o?'on':''}"><input type="radio" name="${nm}" value="${esc(o)}" data-p="${p}"${rr}${cur===o?' checked':''}>${esc(o)}</label>`).join('');
      return `<div class="f" style="${span}"><span class="lbl">${esc(f.l)}${hint?'<br>':''}${hint}</span><div class="${cls}">${body}</div></div>`;
    }

    case 'cks': {
      const cur=V(ctx,f.id)||[];
      const body=f.opts.map(o=>`<label class="${cur.includes(o)?'on':''}"><input type="checkbox" data-p="${p}" data-cks="1" value="${esc(o)}"${rr}${cur.includes(o)?' checked':''}>${esc(o)}</label>`).join('');
      return `<div class="f" style="${span}"><span class="lbl">${esc(f.l)}</span><div class="choice cols3">${body}</div></div>`;
    }

    case 'ck': {
      const cur=!!V(ctx,f.id);
      return `<div class="f" style="${span}"><div class="cbline"><input type="checkbox" id="${p}" data-p="${p}" data-bool="1"${rr}${cur?' checked':''}><label for="${p}">${f.l}</label></div></div>`;
    }

    case 'block': {
      if(f.showIf && !f.showIf(S.data,ctx.item)) return '';
      return `<div style="grid-column:span 12"><div class="block"><div class="bt">${esc(f.l)}</div>${renderFields(f.fields,ctx)}</div></div>`;
    }

    case 'rep':   return `<div style="grid-column:span 12">${renderRepeater(f,ctx)}</div>`;
    case 'hg':    return `<div style="grid-column:span 12">${renderHG(f,ctx)}</div>`;
    case 'docs':  return `<div style="grid-column:span 12">${renderDocs(f,ctx)}</div>`;
    case 'stmts': return `<div style="grid-column:span 12">${renderStmts(f,ctx)}</div>`;
    case 'mtx':   return `<div style="grid-column:span 12">${renderMtx(f,ctx)}</div>`;
    case 'sig':   return `<div style="grid-column:span 12">${renderSig(f,ctx)}</div>`;

    case 'dualhead':
      return `<div style="grid-column:span 12"><div class="dualhead"><div></div><div>${esc(f.a||'Debtor')}</div><div>${esc(f.b||'Spouse')}</div></div></div>`;

    case 'dual': {
      const pa=P(ctx,f.id)+'_d', pb=P(ctx,f.id)+'_s';
      const cell=(pp,who)=>{
        if(f.kind==='sel'){
          const cur=gv(pp)||'';
          return `<div class="dcell" data-who="${who}"><select data-p="${pp}">${f.opts.map(o=>`<option value="${esc(o)}"${cur===o?' selected':''}>${esc(o||'—')}</option>`).join('')}</select></div>`;
        }
        if(f.kind==='money'){
          return `<div class="dcell" data-who="${who}"><div class="money-wrap"><input type="text" inputmode="decimal" data-p="${pp}" data-money="1" value="${esc(gv(pp)||'')}"></div></div>`;
        }

      };
      let label = esc(f.l);
      if(f.labelField){
        label = `${esc(f.l)}: <input type="text" data-p="${P(ctx,f.labelField)}" value="${esc(gv(P(ctx,f.labelField))||'')}" style="width:52%;padding:3px 6px;font-size:12.5px;min-height:26px;border:1px solid var(--line);border-radius:4px" placeholder="describe">`;
      }
      return `<div style="grid-column:span 12"><div class="dual"><div class="dl">${label}</div>${cell(pa,f.wa||'Debtor')}${cell(pb,f.wb||'Spouse')}</div></div>`;
    }

    case 'dualtotal':
      return `<div style="grid-column:span 12"><div class="dual-total"><div>${esc(f.l)}</div>`+
        `<div class="tv" data-calc="${esc(f.id||'')}" data-fn="A">${money(f.fnA(S.data))}</div>`+
        `<div class="tv" data-fn="B">${money(f.fnB(S.data))}</div></div></div>`;

    case 'grandtotal':
      return `<div style="grid-column:span 12"><div class="total-strip"><span class="tl">${esc(f.l)}</span>`+
        `<span class="tv" data-gt="1">${money(f.fn(S.data))}</span></div></div>`;

    case 'review':
      return `<div style="grid-column:span 12" id="review">${renderReview()}</div>`;
  }
  return '';
}

/* ---------- repeater ---------- */
function renderRepeater(f,ctx){
  const path=P(ctx,f.id);
  let arr=gv(path);
  if(!Array.isArray(arr)){ arr=[]; sv(path,arr); }
  if(arr.length < (f.min||0)){ while(arr.length<(f.min||1)) arr.push({}); }
  let out='';
  arr.forEach((item,i)=>{
    const ictx={ base:path+'.'+i+'.', item:item };
    const sum = f.summary?f.summary(item):'';
    out+=`<div class="rep-item">
      <div class="rep-head">
        <span class="rt">${esc(f.l)} ${i+1}</span>
        <span class="rs">${esc(sum)}</span>
        ${arr.length>1?`<button type="button" class="btn sm danger" data-act="del" data-rep="${path}" data-i="${i}">Remove</button>`:''}
      </div>
      <div class="rep-body">${renderFields(f.fields,ictx)}</div>
    </div>`;
  });
  if(!arr.length) out+=`<div class="rep-empty">Nothing added yet.</div>`;
  out+=`<div class="rep-add"><button type="button" class="btn sm" data-act="add" data-rep="${path}">+ ${esc(f.addLabel||('Add another '+f.l.toLowerCase()))}</button></div>`;
  return out;
}

/* which data keys belong to a step (used for the progress ticks) */
function stepKeys(step){
  const keys=[];
  const walk=(fields)=>fields.forEach(f=>{
    if(f.t==='rep'){ keys.push({rep:f.id}); }
    else if(f.t==='hg'){ f.items.forEach(i=>keys.push('hg_'+i[0]+'_on')); }
    else if(f.t==='docs'){ f.items.forEach(i=>keys.push('doc_'+i[0])); }
    else if(f.t==='stmts'){ f.items.forEach(i=>keys.push('stm_'+i[0])); }
    else if(f.t==='mtx'){ const rows=f.rows||[['ind'],['sp']];
      rows.forEach(r=>f.months.forEach(c=>keys.push(`${f.id}_${r[0]}_${c[0]}`))); }
    else if(f.t==='dual'){ keys.push(f.id+'_d'); keys.push(f.id+'_s'); }
    else if(f.t==='block'){ walk(f.fields); }
    else if(f.t==='sig'){ keys.push(f.id); keys.push(f.nameId); }
    else if(f.id) keys.push(f.id);
  });
  step.sections.forEach(sec=>{
    if(sec.none) keys.push(sec.none);
    if(sec.totalId) keys.push(sec.totalId);
    walk(sec.fields);
  });
  return keys;
}
const _stepKeyCache={};
function stepHasData(step){
  if(step.id==='review') return false;
  const keys=_stepKeyCache[step.id] || (_stepKeyCache[step.id]=stepKeys(step));
  const AUTO={formDate:1, mtDate:1};
  for(const k of keys){
    if(typeof k==='string' && AUTO[k]) continue;
    if(typeof k==='object'){
      const a=S.data[k.rep];
      if(Array.isArray(a) && a.some(o=>Object.values(o).some(v=>v!==''&&v!=null&&!(Array.isArray(v)&&!v.length)))) return true;
      continue;
    }
    const v=S.data[k];
    if(v===true) return true;
    if(typeof v==='string' && v.trim()!=='') return true;
    if(Array.isArray(v) && v.length) return true;
  }
  return false;
}

/* ---------- live totals without a full re-render ---------- */
function refreshTotals(){
  const vs=visibleSteps(); const st=vs[S.step];
  const body=document.getElementById('stepBody');
  /* section totalFn subtotals */
  const secEls=[...body.querySelectorAll('.sec')];
  let si=0;
  st.sections.filter(secVisible).forEach((sec,i)=>{
    const el=secEls[i]; if(!el) return;
    const t=el.querySelector('[data-secfn]');
    if(t && sec.totalFn) t.textContent=money(sec.totalFn(S.data));
  });
  /* dual totals + grand totals + matrix row totals */
  const flat=[]; const walk=(fs)=>fs.forEach(f=>{ flat.push(f); if(f.t==='block') walk(f.fields); });
  st.sections.forEach(s=>walk(s.fields));
  const dts=[...body.querySelectorAll('.dual-total')];
  let k=0;
  flat.filter(f=>f.t==='dualtotal').forEach(f=>{
    const el=dts[k++]; if(!el) return;
    const cells=el.querySelectorAll('.tv');
    if(cells[0]) cells[0].textContent=money(f.fnA(S.data));
    if(cells[1]) cells[1].textContent=money(f.fnB(S.data));
  });
  const gts=[...body.querySelectorAll('[data-gt]')];
  let g=0;
  flat.filter(f=>f.t==='grandtotal').forEach(f=>{ const el=gts[g++]; if(el) el.textContent=money(f.fn(S.data)); });
  flat.filter(f=>f.t==='mtx').forEach(f=>{
    const rows=f.rows||[['ind','Individual'],['sp','Spouse']];
    rows.forEach(r=>{
      const el=body.querySelector(`[data-mtxtot="${f.id}_${r[0]}"]`);
      if(el) el.textContent=money(mtxRowTotal(f,r[0]));
    });
  });
}
function currentSections(){ return visibleSteps()[S.step].sections; }
/* ============================================================
   REVIEW / PRINT VIEW
   ============================================================ */
function rvVal(f,ctx){
  const raw = f.id ? gv(P(ctx,f.id)) : '';
  switch(f.t){
    case 'money': return (raw===''||raw==null)?'':money(num(raw));
    case 'cks':   return Array.isArray(raw)?raw.join(', '):'';
    case 'ck':    return raw?'Yes':'';
    default:      return (raw==null)?'':String(raw);
  }
}
function rvRow(label,val){
  const empty = (val===''||val==null);
  return `<tr><td class="k">${label}</td><td class="v${empty?' empty':''}">${empty?'—':esc(val)}</td></tr>`;
}
function rvFields(fields,ctx){
  let rows='', extra='';
  fields.forEach(f=>{
    if(!fieldVisible(f,ctx)) return;
    switch(f.t){
      case 'h': case 'note': case 'legal': case 'dualhead': break;
      case 'block':
        if(f.showIf && !f.showIf(S.data,ctx.item)) break;
        extra += `<h3>${esc(f.l)}</h3>` + rvFields(f.fields,ctx);
        break;
      case 'rep': {
        const arr=gv(P(ctx,f.id))||[];
        const used=arr.filter(o=>Object.values(o).some(v=>v!==''&&v!=null&&!(Array.isArray(v)&&!v.length)));
        if(!used.length){ extra+=`<h3>${esc(f.l)}s</h3><p style="font-size:12.5px;color:#8b95a1">None listed.</p>`; break; }
        used.forEach((item,i)=>{
          extra += `<h3>${esc(f.l)} ${i+1}</h3>` + rvFields(f.fields,{base:P(ctx,f.id)+'.'+arr.indexOf(item)+'.',item});
        });
        break;
      }
      case 'hg': {
        let r='';
        f.items.forEach(it=>{ if(S.data['hg_'+it[0]+'_on'])
          r+=rvRow(esc(it[1])+(S.data['hg_'+it[0]+'_x']?' ('+esc(S.data['hg_'+it[0]+'_x'])+')':''), money(num(S.data['hg_'+it[0]+'_v']))); });
        extra += r?`<table>${r}</table>`:'<p style="font-size:12.5px;color:#8b95a1">No items checked.</p>';
        break;
      }
      case 'docs': {
        let r=''; f.items.forEach(it=>{ r+=rvRow(it[1], S.data['doc_'+it[0]]?'Yes':''); });
        extra += `<table>${r}</table>`; break;
      }
      case 'stmts': {
        let r=''; f.items.forEach(it=>{ r+=rvRow(esc(it[1])+' — '+it[2], S.data['stm_'+it[0]]||''); });
        extra += `<table>${r}</table>`; break;
      }
      case 'mtx': {
        const rowsD=f.rows||[['ind','Individual'],['sp','Spouse']];
        let h='<table><tr><td class="k"></td>'+f.months.map(c=>`<td class="k">${esc(c[1])}</td>`).join('')+'<td class="k">Total</td></tr>';
        rowsD.forEach(r=>{
          h+=`<tr><td class="k">${esc(r[1])}</td>`+
             f.months.map(c=>{const v=S.data[`${f.id}_${r[0]}_${c[0]}`]; return `<td class="v${v?'':' empty'}">${v?esc(money(num(v))):'—'}</td>`;}).join('')+
             `<td class="v">${money(mtxRowTotal(f,r[0]))}</td></tr>`;
        });
        extra += h+'</table>'; break;
      }
      case 'dual': {
        const a=gv(P(ctx,f.id)+'_d'), b=gv(P(ctx,f.id)+'_s');
        if((a===''||a==null)&&(b===''||b==null)) break;
        const fmt=v=>f.kind==='money'?((v===''||v==null)?'':money(num(v))):(v||'');
        let lab=esc(f.l);
        if(f.labelField && gv(P(ctx,f.labelField))) lab+=': '+esc(gv(P(ctx,f.labelField)));
        rows += `<tr><td class="k">${lab}</td><td class="v">${esc(fmt(a))}${(b!==''&&b!=null)?' <span style="color:#8b95a1">/ spouse:</span> '+esc(fmt(b)):''}</td></tr>`;
        break;
      }
      case 'dualtotal':
        rows += `<tr><td class="k"><b>${esc(f.l)}</b></td><td class="v"><b>${esc(money(f.fnA(S.data)))}</b>${f.fnB(S.data)?' / spouse: '+esc(money(f.fnB(S.data))):''}</td></tr>`;
        break;
      case 'grandtotal':
        rows += `<tr><td class="k"><b>${esc(f.l)}</b></td><td class="v"><b>${esc(money(f.fn(S.data)))}</b></td></tr>`;
        break;
      case 'sig':
        if(f.showIf && !f.showIf(S.data)) break;
        rows += rvRow('Print name — '+esc(f.l), S.data[f.nameId]||'');
        rows += rvRow('Signed', S.data[f.id]||'');
        rows += rvRow('Date', S.data[f.dateId]||'');
        break;
      case 'review': break;
      default:
        rows += rvRow(esc(f.l||f.id), rvVal(f,ctx));
    }
  });
  return (rows?`<table>${rows}</table>`:'') + extra;
}

document.addEventListener('input', ev=>{
  const el=ev.target;
  const p=el.getAttribute && el.getAttribute('data-p');
  if(!p) return;
  if(el.type==='checkbox' && el.getAttribute('data-cks')){
    const cur=(gv(p)||[]).slice();
    const i=cur.indexOf(el.value);
    if(el.checked && i<0) cur.push(el.value);
    if(!el.checked && i>=0) cur.splice(i,1);
    sv(p,cur);
    el.closest('label')?.classList.toggle('on',el.checked);
  } else if(el.type==='checkbox'){
    sv(p, el.checked);
    el.closest('.none-toggle')?.classList.toggle('on',el.checked);
  } else if(el.type==='radio'){
    sv(p, el.value);
    const grp=el.closest('.choice');
    if(grp) grp.querySelectorAll('label').forEach(l=>l.classList.toggle('on', l.contains(el)&&el.checked));
  } else {
    sv(p, el.value);
  }
  markDirty();
  if(el.getAttribute('data-rr') && !isTextEntry(el)){ renderStep(); return; }
  refreshTotals();
  const rh=el.closest('.rep-item')?.querySelector('.rs');
  if(rh) updateRepSummaries();
  renderNav();
});

/* a free-text field that gates another field must wait for blur, or the
   re-render would steal focus mid-word */
function isTextEntry(el){
  if(el.tagName==='TEXTAREA') return true;
  return el.tagName==='INPUT' && ['text','tel','email','number','date','search'].includes(el.type);
}
document.addEventListener('change', ev=>{
  const el=ev.target;
  if(el.getAttribute && el.getAttribute('data-p') && el.getAttribute('data-rr') && isTextEntry(el)){
    renderStep();
  }
});

/* money tidy-up on blur */
document.addEventListener('blur', ev=>{
  const el=ev.target;
  if(!el.getAttribute || !el.getAttribute('data-money')) return;
  const raw=el.value.trim();
  if(raw==='') return;
  const n=num(raw);
  const out=n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  el.value=out; sv(el.getAttribute('data-p'), out);
  refreshTotals();
}, true);

function updateRepSummaries(){
  const st=visibleSteps()[S.step];
  const flat=[]; const walk=fs=>fs.forEach(f=>{ if(f.t==='rep') flat.push(f); if(f.t==='block') walk(f.fields); });
  st.sections.forEach(s=>walk(s.fields));
  const nodes=[...body().querySelectorAll('.rep-item')];
  let n=0;
  flat.forEach(f=>{
    const arr=gv(f.id)||[];
    arr.forEach(item=>{
      const el=nodes[n++]; if(!el) return;
      const s=el.querySelector('.rs');
      if(s && f.summary) s.textContent=f.summary(item)||'';
    });
  });
}

/* clicks: repeater add/remove, nav */
document.addEventListener('click', ev=>{
  const b=ev.target.closest('button');
  if(!b) return;
  const act=b.getAttribute('data-act');
  if(act==='add'){
    const path=b.getAttribute('data-rep');
    const arr=gv(path)||[]; arr.push({}); sv(path,arr);
    markDirty(); renderStep();
    return;
  }
  if(act==='del'){
    const path=b.getAttribute('data-rep'), i=+b.getAttribute('data-i');
    const arr=gv(path)||[]; arr.splice(i,1); sv(path,arr);
    markDirty(); renderStep();
    return;
  }
  const go=b.getAttribute('data-goto');
  if(go!==null && go!==undefined){ S.step=+go; renderStep(); }
});

document.getElementById('mobSelect').addEventListener('change', e=>{ S.step=+e.target.value; renderStep(); });
document.getElementById('btnBack').addEventListener('click', ()=>{ S.step--; renderStep(); });
document.getElementById('btnNext').addEventListener('click', ()=>{
  const vs=visibleSteps();
  if(S.step<vs.length-1){ S.step++; renderStep(); }
  else { doSave(); }
});

/* attorney mode — absent from the client build, so guard the wiring */
const _btnAtt = document.getElementById('btnAttorney');
if(_btnAtt) _btnAtt.addEventListener('click', ()=>{
  S.attorney=!S.attorney;
  document.body.classList.toggle('attorney',S.attorney);
  const b=document.getElementById('btnAttorney');
  b.textContent = S.attorney?'Attorney mode: ON':'Attorney mode';
  b.classList.toggle('gold',S.attorney);
  document.getElementById('brandSub').textContent = S.attorney?'Client Questionnaire — attorney view':'Client Questionnaire';
  renderStep();
});

/* ---------- save ---------- */
function safeName(){
  const n=(S.data.clientName || [S.data.d_Last,S.data.d_First].filter(Boolean).join('-') || 'Client')
    .replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'');
  const d=new Date().toISOString().slice(0,10);
  return `Questionnaire-${n}-${d}.json`;
}
function doSave(){
  const payload={
    _meta:{ form:'Schumacher Lane, PLLC — Client Questionnaire', version:FORM_VERSION,
            savedAt:new Date().toISOString(), client:S.data.clientName||'' },
    data:S.data
  };
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const name=safeName();
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500);
  markSaved(name);
}
document.getElementById('btnSave').addEventListener('click', doSave);
document.getElementById('btnSave2').addEventListener('click', doSave);

/* ---------- load ---------- */
document.getElementById('btnLoad').addEventListener('click', ()=>{
  if(S.dirty && !confirm('You have unsaved changes. Opening a saved file will replace what is on screen. Continue?')) return;
  document.getElementById('fileIn').click();
});
document.getElementById('fileIn').addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const j=JSON.parse(r.result);
      S.data = (j && j.data) ? j.data : j;
      S.step=0; S.dirty=false;
      document.getElementById('saveDot').className='dot saved';
      document.getElementById('saveMsg').textContent='Opened '+f.name;
      const n=S.data.clientName||[S.data.d_First,S.data.d_Last].filter(Boolean).join(' ');
      document.getElementById('clientTag').textContent=n?('· '+n):'';
      renderStep();
    }catch(err){
      alert('That file could not be read. Make sure it is the questionnaire file that this form saved.\n\n'+err.message);
    }
  };
  r.readAsText(f);
  e.target.value='';
});

/* ---------- print ---------- */
document.getElementById('btnPrint').addEventListener('click', ()=>{
  const vs=visibleSteps();
  const i=vs.findIndex(s=>s.id==='review');
  if(i>=0 && S.step!==i){ S.step=i; renderStep(); }
  setTimeout(()=>window.print(),150);
});

window.addEventListener('beforeunload', e=>{
  if(S.dirty){ e.preventDefault(); e.returnValue=''; }
});

/* ---------- init ---------- */
const FORM_VERSION='1.0';
/* strip anything attorney-only out of the client build entirely, so it cannot
   be revealed by flipping a flag in the console */
function stripAttorney(){
  const clean = fs => fs.filter(f=>!f.attorney).map(f=>{
    if(f.fields) return {...f, fields:clean(f.fields)};
    return f;
  });
  STEPS.forEach(st=>{
    st.sections = st.sections.filter(sec=>!sec.attorney)
                             .map(sec=>({...sec, fields:clean(sec.fields)}));
  });
  const b=document.getElementById('btnAttorney');
  if(b) b.remove();
}

(function init(){
  if(!BUILD.attorneyMode) stripAttorney();
  autoRerender();
  const t=new Date();
  S.data.formDate = t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
  S.data.mtDate = S.data.formDate;
  renderStep();
  S.dirty=false;
  document.getElementById('saveMsg').textContent='Nothing entered yet';
})();
/* ============================================================
   OPT-IN BROWSER AUTOSAVE  (hosted / client build only)
   Off by default. Everything is wrapped so that a browser with
   storage disabled, a private window, or a locked-down kiosk
   degrades to the plain form rather than breaking.
   ============================================================ */
(function autosaveModule(){
  if(!BUILD.autosave) return;

  const LS_KEY = 'slq_draft_v1';
  const storage = (function(){
    try{
      const k='__slq_probe__';
      window.localStorage.setItem(k,'1');
      window.localStorage.removeItem(k);
      return window.localStorage;
    }catch(e){ return null; }
  })();
  if(!storage) return;                     /* no storage → no toggle, no promise */

  let timer=null, on=false;

  function readDraft(){
    try{ const raw=storage.getItem(LS_KEY); return raw?JSON.parse(raw):null; }
    catch(e){ return null; }
  }
  function writeDraft(){
    try{
      storage.setItem(LS_KEY, JSON.stringify({
        savedAt:new Date().toISOString(),
        data:S.data
      }));
      stamp('Saved in this browser · ' + new Date().toLocaleTimeString());
    }catch(e){
      /* quota, private mode, or the user revoked storage mid-session */
      on=false;
      const cb=document.getElementById('asToggle'); if(cb) cb.checked=false;
      stamp('This browser would not let us save — use “Save my answers” instead');
    }
  }
  function dropDraft(){ try{ storage.removeItem(LS_KEY); }catch(e){} }
  function stamp(msg){
    const el=document.getElementById('asStamp'); if(el) el.textContent=msg;
  }
  function schedule(){
    if(!on) return;
    clearTimeout(timer);
    timer=setTimeout(writeDraft,600);
  }

  /* ---------- controls in the status bar ---------- */
  function mountControls(){
    const bar=document.querySelector('.savebar-in');
    if(!bar) return;
    const wrap=document.createElement('span');
    wrap.className='autosave-ctl no-print';
    wrap.innerHTML =
      '<label class="as-toggle"><input type="checkbox" id="asToggle"> Keep my progress in this browser</label>'+
      '<button type="button" class="btn sm as-clear" id="btnClearLocal">Clear saved answers</button>'+
      '<span id="asStamp" class="as-stamp"></span>';
    bar.insertBefore(wrap, bar.querySelector('#clientTag'));

    document.getElementById('asToggle').addEventListener('change', e=>{
      on = e.target.checked;
      if(on){
        if(!confirm('This keeps your answers in this browser so you can come back later.\n\nOnly do this on a private device — on a shared or public computer your information would stay behind.\n\nTurn it on?')){
          e.target.checked=false; on=false; return;
        }
        writeDraft();
      } else {
        dropDraft();
        stamp('Not saving in this browser');
      }
    });

    document.getElementById('btnClearLocal').addEventListener('click', ()=>{
      if(!confirm('Erase the copy of your answers stored in this browser?\n\nThis does not touch any file you have already downloaded.')) return;
      dropDraft();
      on=false;
      const cb=document.getElementById('asToggle'); if(cb) cb.checked=false;
      stamp('Cleared from this browser');
    });

    stamp('Not saving in this browser');
  }

  /* ---------- offer to restore an earlier draft ---------- */
  function offerRestore(draft){
    const main=document.querySelector('main.main');
    if(!main) return;
    const when = (()=>{ try{ return new Date(draft.savedAt).toLocaleString(); }catch(e){ return 'earlier'; } })();
    /* deliberately no name here — on a shared computer the banner would
       otherwise announce the previous person to whoever sits down next */
    const bar=document.createElement('div');
    bar.className='restore-bar no-print';
    bar.innerHTML =
      '<div><b>There are unfinished answers saved in this browser</b> from '+esc(when)+'.</div>'+
      '<div class="rb-btns">'+
        '<button type="button" class="btn gold sm" id="rbYes">Pick up where I left off</button>'+
        '<button type="button" class="btn sm" id="rbNo">Start fresh</button>'+
      '</div>';
    main.insertBefore(bar, main.firstChild);

    document.getElementById('rbYes').addEventListener('click', ()=>{
      S.data = draft.data || {};
      S.step = 0;
      on = true;
      const cb=document.getElementById('asToggle'); if(cb) cb.checked=true;
      bar.remove();
      renderStep();
      stamp('Restored from this browser');
      document.getElementById('saveDot').className='dot unsaved';
      document.getElementById('saveMsg').textContent='Restored — remember to press “Save my answers” when you finish';
    });
    document.getElementById('rbNo').addEventListener('click', ()=>{
      if(!confirm('Discard the answers saved in this browser and start over?')) return;
      dropDraft(); bar.remove(); stamp('Not saving in this browser');
    });
  }

  /* ---------- wire up ---------- */
  mountControls();
  document.addEventListener('input',  schedule);
  document.addEventListener('change', schedule);
  document.addEventListener('click',  ev=>{ if(ev.target.closest('button[data-act]')) schedule(); });

  const draft=readDraft();
  if(draft && draft.data && Object.keys(draft.data).length>2) offerRestore(draft);
})();

</script>
